<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Weather App</title>
    <link rel="icon" type="image/svg+xml" href="public/icons/weather/01d.svg" />
    <link rel="stylesheet" href="./main.css" />
    <script type="module" src="./scripts/script.js"></script>
  </head>
  <body>
    <div class="page">
      <div class="weather-app">
        <header class="weather-app__header">
          <a href="/" class="logo">
            <picture>
              <source media="(min-width: 1024px)" srcset="public/logo.svg" />
              <img src="public/logo-mobile.svg" class="logo__img" alt="Логотип WA" />
            </picture>
          </a>
          <form class="search">
            <label for="search-city" class="visually-hidden">Поиск города</label>
            <input
              id="search-city"
              type="text"
              class="search__input"
              placeholder="Поиск по городу"
            />

            <button type="reset" class="search__button" aria-label="Очистить поле поиска">
              <div class="search__icon search__icon_type_close"></div>
            </button>
            <div aria-hidden="true" class="search__icon search__icon_type_search"></div>
          </form>
        </header>
        <main class="weather-app__today">
          <h1 class="visually-hidden">Погода онлайн</h1>
          <section class="weather-info">
            <div class="weather-info__location">
              <h2 class="weather-info__city">Москва</h2>
              <time datetime="2026-01-01" class="weather-info__date"></time>
              <time datetime="00:00" class="weather-info__time"></time>
            </div>
            <div class="weather-info__temp">
              <p class="weather-info__degrees"></p>
            </div>
            <div class="weather-info__meta">
              <p class="weather-info__status">
                <img
                  class="weather-info__icon"
                  src="public/icons/weather/01d.svg"
                  alt=""
                  width="24"
                  height="24"
                />
                <span class="weather-info__weather"></span>
              </p>
              <p class="weather-info__feel"></p>
            </div>
          </section>
          <ul class="weather-details"></ul>
          <template data-weather-card-template>
            <li class="weather-details__card">
              <div class="weather-details__values">
                <h3 class="weather-details__title">Параметр</h3>
                <div class="weather-details__icon" aria-hidden="true"></div>
                <div class="weather-details__value"></div>
              </div>

              <div class="weather-details__meta">
                <div class="weather-details__progress-bar progress-track">
                  <div class="progress-thumb"></div>
                </div>

                <p class="weather-details__progress-values">
                  <span class="weather-details__initial-value"></span>
                  <span class="weather-details__final-value"></span>
                </p>
                <p class="weather-details__text"></p>
              </div>
            </li>
          </template>
        </main>
        <section class="forecast">
          <header class="forecast__header">
            <h2 class="forecast__title">Прогноз:</h2>
            <nav class="forecast__tabs">
              <ul class="forecast__tabs-list">
                <li>
                  <button
                    class="forecast__tab forecast__tab_active"
                    type="button"
                    data-forecast="24h"
                  >
                    на 24 часа
                  </button>
                </li>
                <li>
                  <button class="forecast__tab" type="button" data-forecast="5d">на 5 дней</button>
                </li>
              </ul>
            </nav>
          </header>
          <div class="forecast__slider">
            <button
              class="forecast__arrow forecast__arrow_type_prev"
              aria-label="Предыдущие"
              type="button"
              disabled
            ></button>
            <div class="forecast__list-wrapper">
              <ul class="forecast__list"></ul>
            </div>
            <template data-forecast-card-template>
              <li class="forecast__item">
                <time class="forecast__time" datetime="12:00"></time>
                <img
                  class="forecast__icon"
                  src="public/icons/weather/01d.svg"
                  alt=""
                  width="32"
                  height="32"
                />
                <span class="forecast__temp"></span>
              </li>
            </template>
            <button
              class="forecast__arrow forecast__arrow_type_next"
              aria-label="Следующие"
              type="button"
            ></button>
          </div>
        </section>
        <footer class="footer">
          <p class="footer__text">
            Проект выполнен в рамках стажировки
            <a
              href="https://preax.ru"
              target="_blank"
              rel="noopener noreferrer"
              class="footer__link"
              >PREAX</a
            >
          </p>
        </footer>
      </div>
    </div>
  </body>
</html>
