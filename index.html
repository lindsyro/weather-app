<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link rel="stylesheet" href="main.css" />
    <script type="module" src="script.js" defer></script>
  </head>
  <body>
    <div class="page">
      <div class="weather-app">
        <header class="weather-app__header">
          <a href="/" class="logo">
            <img
              src="./public/logo.svg"
              class="logo__img"
              alt="Логотип"
            />
          </a>
          <form class="search">
            <input
              type="text"
              class="search__input"
              placeholder="Поиск по городу"
              aria-label="Поиск города"
            />
            <button type="button" class="search__button">
              <img
                src="./public/icons/input/search.png"
                alt="Поиск"
                class="search__icon search__icon_type_search"
              />
              <img
                src="./public/icons/input/close.svg"
                alt="Очистить"
                class="search__icon search__icon_type_close"
              />
              <img
                src="./public/icons/input/close-hover.png"
                alt="Очистить"
                class="search__icon search__icon_type_close_hover"
              />
            </button>
          </form>
        </header>
        <main class="weather-app__today">
          <section class="weather-info">
            <div class="weather-info__location">
              <h1 class="weather-info__city"></h1>
              <p class="weather-info__date"></p>
              <time class="weather-info__time"></time>
            </div>
            <div class="weather-info__temp">
              <p class="weather-info__degrees"></p>
            </div>
            <div class="weather-info__meta">
              <p class="weather-info__status">
                <img
                  class="weather-info__icon"
                  src=""
                  width="24"
                  height="24"
                />
                <span class="weather-info__weather"></span>
              </p>
              <p class="weather-info__feel"></p>
            </div>
          </section>
          <ul class="weather-details"></ul>
          <template data-weather-card-template>
            <li class="weather-details__card">
              <div class="weather-details__values">
                <h3 class="weather-details__title"></h3>
                <img class="weather-details__icon" src="" alt="" />
                <div class="weather-details__value"></div>
              </div>

              <div class="weather-details__meta">
                <img class="weather-details__progress-bar" src=""></img>
                <p class="weather-details__progress-values">
                  <span class="weather-details__initial-value"></span>
                  <span class="weather-details__final-value"></span>
                </p>
                <p class="weather-details__text"></p>
              </div>
            </li>
          </template>
        </main>
      </div>
    </div>
  </body>
</html>
