<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App - Sprint 1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="weather-app">
      
      <header class="weather-header">
        <a href="/" class="logo-link">
          <img src="public/Desktop & Tablet.svg" class="logo-img">
        </a>
          <form class="search-form">
              <input type="text" class="search-input" placeholder="Поиск по городу" aria-label="Поиск города"> 
              <button type="submit" class="search-button">
                  <img src="public/search.png" alt="Поиск" class="search-icon icon-search">
                  <img src="public/close.svg" alt="Очистить" class="search-icon icon-close">
              </button> 
          </form>
      </header>

      <div class="weather-today">

        <section class="weather-today-info">
            <div class="">
                <h1 class="weather-city">Москва</h1>
                <p class="weather-date">Суббота, 06 января</p>
                <p class="weather-time">11:29</p>
            </div>
                <div class="weather-temp">
                <p class="degrees">-7°</p>
            </div>
             
            <div class="weather-other-info">
                <p class="weather-other-info-cloudiness">
                    <img src="public/weather.svg" alt="" class="weather-icon">
                    Облачно
                </p>
                <p class="weather-other-info-feel"> Ощущается как -11° </p>
            </div>
        </section>

        <section class="weather-more-details">
          <div class="tablet"></div>
          <div class="tablet"></div>
          <div class="tablet"></div>
          <div class="tablet"></div>
          <div class="tablet"></div>
          <div class="tablet"></div>
        </section>

      </div>
  </main>

</body>
</html>
